name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # attach the zip to a release when a version tag is pushed

jobs:
  hygiene:
    # No game content, binaries or personal data in the repository (tools/check_repo.py).
    # Extra words to reject are in the repository variable HYGIENE_WORDS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check files and commits
        env:
          HYGIENE_WORDS: ${{ vars.HYGIENE_WORDS }}
        run: python3 tools/check_repo.py --commits HEAD

  build:
    needs: hygiene
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure (32-bit)
        run: cmake -S . -B build -A Win32

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { "SWROTS-PC-$env:GITHUB_REF_NAME" } else { "SWROTS-PC-$($env:GITHUB_SHA.Substring(0,7))" }
          $dir = "package/$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item build/bin/swrots.exe, build/bin/core.dll, README.md, CHANGELOG.md, LICENSE, THIRD_PARTY_NOTICES.md $dir
          Copy-Item -Recurse docs "$dir/docs"
          Compress-Archive -Path "$dir/*" -DestinationPath "package/$name.zip"
          "PACKAGE=$name" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: package/${{ env.PACKAGE }}/

      - name: Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release notes are the version's section of CHANGELOG.md ("## [vX.Y.Z]" up to the next
          # "## "); without one, GitHub's generated notes.
          $tag = "${{ github.ref_name }}"
          $notes = @()
          $inSection = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line.StartsWith("## ")) {
              if ($inSection) { break }
              $inSection = $line.StartsWith("## [$tag]")
              continue
            }
            if ($inSection) { $notes += $line }
          }
          $zip = "package/${{ env.PACKAGE }}.zip"
          if ($notes.Count -gt 0) {
            $notes += "", "All releases: [changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
            Set-Content -Path release-notes.md -Value $notes -Encoding utf8
            gh release create $tag $zip --title $tag --notes-file release-notes.md --prerelease
          } else {
            gh release create $tag $zip --title $tag --generate-notes --prerelease
          }
